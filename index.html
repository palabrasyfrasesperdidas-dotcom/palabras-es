<body>

    <header>
        <h1>Palabras y frases perdidas</h1>
        <p class="subtitle">Colección de huellas y reflexiones</p>
    </header>

    <div class="viewer-section">
        <div class="controls">
            <button id="homeBtn">🏠 Home</button>
            <select id="blockSelect"></select>
            <button id="prevBtn">&larr; Anterior</button>
            <button id="nextBtn">Siguiente &rarr;</button>
            <button id="randomBtn">🎲 Aleatoria</button>
        </div>

        <!-- Controles de interacción agrupados arriba -->
        <div id="botonesAccionContainer"></div>

        <div class="canvas-container">
            <div id="loading">Cargando...</div>
            <canvas id="cardCanvas"></canvas>
        </div>

        <div class="info-panel">
            <span id="huellaCounter">--</span>
        </div>
    </div>

<script>
    const BIN_ID = "6a92fe69f5f4af5e2951f6fb";
    const API_KEY = "$2a$10$cjWB6UsaBPWauztsla0YPOSy9cQHEcoA7iVzbdmOXpDrwNk6gf87C";

    const blockNamesES = [
        "Bloque 1: Geometría del destino",
        "Bloque 2: Arquitectura del alma",
        "Bloque 3: Anatomía del silencio",
        "Bloque 4: El Miedo y sus Sombras",
        "Bloque 5: La Mirada del Mundo",
        "Bloque 6: El Ruido de los Necios",
        "Bloque 7: El Cielo de las Estrellas",
        "Bloque 8: La Ética del Corazón",
        "Bloque 9: El Tiempo que Respira",
        "Bloque 10: El Juego de Vivir",
        "Bloque 11: El latido de la libertad",
        "Bloque 12: La anatomía del pensamiento",
        "Bloque 13: El Universo de las Palabras",
        "Bloque 14: La Soledad que Habla"
    ];

    let allFrases = [];
    let currentFilteredFrases = [];
    let currentIndex = parseInt(sessionStorage.getItem('pyfp_es_index') || '0', 10);
    let animationFrameId = null;
    let currentVideoElem = null;

    let canvas, ctx, blockSelect, prevBtn, nextBtn, randomBtn, homeBtn, huellaCounter, loadingElem, botonesAccionContainer;

    function populateSelect() {
        if (!blockSelect) return;
        const currentVal = sessionStorage.getItem('pyfp_es_block') || "1";
        blockSelect.innerHTML = "";
        blockNamesES.forEach((name, index) => {
            const opt = document.createElement('option');
            opt.value = (index + 1).toString();
            opt.textContent = name;
            if ((index + 1).toString() === currentVal) {
                opt.selected = true;
            }
            blockSelect.appendChild(opt);
        });
    }

    async function loadData() {
        if (loadingElem) {
            loadingElem.style.display = 'block';
            loadingElem.textContent = "Cargando...";
        }
        try {
            const response = await fetch('frases.json?t=' + Date.now());
            if (!response.ok) throw new Error("Error HTTP " + response.status);
            allFrases = await response.json();
            if (loadingElem) loadingElem.style.display = 'none';

            let activeBlock = sessionStorage.getItem('pyfp_es_block') || "1";
            if (blockSelect) blockSelect.value = activeBlock;

            filterByBlock(parseInt(activeBlock, 10), true);
        } catch (error) {
            console.error("Error al cargar datos:", error);
            if (loadingElem) {
                loadingElem.style.display = 'block';
                loadingElem.textContent = "Error al cargar frases.json";
            }
        }
    }

    function filterByBlock(blockNum, keepIndex = false) {
        sessionStorage.setItem('pyfp_es_block', blockNum.toString());
        currentFilteredFrases = allFrases.filter(f => Number(f.bloque || f.block) === Number(blockNum));
        
        if (!keepIndex) {
            currentIndex = 0;
        } else {
            const savedIndex = parseInt(sessionStorage.getItem('pyfp_es_index') || '0', 10);
            currentIndex = (savedIndex < currentFilteredFrases.length) ? savedIndex : 0;
        }

        if (currentFilteredFrases.length === 0) {
            stopAnimation();
            if (huellaCounter) huellaCounter.textContent = "Sin huellas en este bloque";
            if (botonesAccionContainer) botonesAccionContainer.innerHTML = "";
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        renderCurrentHuella();
    }

    function stopAnimation() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        if (currentVideoElem) {
            currentVideoElem.pause();
            currentVideoElem.removeAttribute('src');
            currentVideoElem.load();
            currentVideoElem = null;
        }
    }

    function renderCurrentHuella() {
        if (currentFilteredFrases.length === 0) return;

        stopAnimation();
        sessionStorage.setItem('pyfp_es_index', currentIndex.toString());

        const item = currentFilteredFrases[currentIndex];
        const currentBlockNum = Number(item.bloque || item.block);
        const idUnico = `es_${item.id || (currentBlockNum + '_' + currentIndex)}`;

        if (huellaCounter) {
            huellaCounter.textContent = `Huella ${item.id} (${currentIndex + 1} / ${currentFilteredFrases.length})`;
        }
        if (prevBtn) prevBtn.disabled = currentIndex === 0;
        if (nextBtn) nextBtn.disabled = currentIndex === currentFilteredFrases.length - 1;

        // Renderizar los botones de interacción arriba, justo debajo de la navegación
        if (botonesAccionContainer) {
            botonesAccionContainer.innerHTML = `
                <div class="interaccion-container">
                    <button class="btn-accion" id="btn-huella-${idUnico}" onclick="darHuella('${idUnico}')">
                        ⭐ Dejar huella (<span id="count-huella-${idUnico}">0</span>)
                    </button>
                    <button class="btn-accion" id="btn-rumbo-${idUnico}" onclick="alternarRumbo('${idUnico}')">
                        🧭 Guardar ruta
                    </button>
                </div>
            `;
            actualizarEstadoUIInteraccion(idUnico);
        }

        const imgPath = `plantilla${currentBlockNum}.png`;
        const videoPath = `plantilla${currentBlockNum}_video.mp4`;

        const bgImg = new Image();
        bgImg.src = imgPath;

        bgImg.onload = () => {
            adjustCanvasSize(bgImg.naturalWidth, bgImg.naturalHeight);
            drawCanvasFrame(bgImg, item.texto);
            tryLoadVideo(videoPath, item.texto, bgImg);
        };

        bgImg.onerror = () => {
            drawTextOnly(item.texto);
        };
    }

    async function actualizarEstadoUIInteraccion(idUnico) {
        if (localStorage.getItem(`huella_${idUnico}`)) {
            const btn = document.getElementById(`btn-huella-${idUnico}`);
            if (btn) btn.classList.add('activo-huella');
        }
        if (localStorage.getItem(`rumbo_${idUnico}`)) {
            const btnRumbo = document.getElementById(`btn-rumbo-${idUnico}`);
            if (btnRumbo) btnRumbo.classList.add('activo-rumbo');
        }

        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await response.json();
            let contadores = data.record || {};
            
            const contadorSpan = document.getElementById(`count-huella-${idUnico}`);
            if (contadorSpan) {
                contadorSpan.textContent = contadores[idUnico] || 0;
            }
        } catch (e) {
            console.error("No se pudieron cargar las huellas", e);
        }
    }

    async function darHuella(idUnico) {
        if (localStorage.getItem(`huella_${idUnico}`)) return;

        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await response.json();
            let contadores = data.record || {};

            contadores[idUnico] = (contadores[idUnico] || 0) + 1;

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(contadores)
            });

            localStorage.setItem(`huella_${idUnico}`, 'true');
            const btn = document.getElementById(`btn-huella-${idUnico}`);
            const countSpan = document.getElementById(`count-huella-${idUnico}`);
            if (btn) btn.classList.add('activo-huella');
            if (countSpan) countSpan.textContent = contadores[idUnico];

        } catch (e) {
            console.error("Error al registrar la huella", e);
        }
    }

    function alternarRumbo(idUnico) {
        const btnRumbo = document.getElementById(`btn-rumbo-${idUnico}`);
        
        if (localStorage.getItem(`rumbo_${idUnico}`)) {
            localStorage.removeItem(`rumbo_${idUnico}`);
            if (btnRumbo) btnRumbo.classList.remove('activo-rumbo');
        } else {
            localStorage.setItem(`rumbo_${idUnico}`, 'true');
            if (btnRumbo) btnRumbo.classList.add('activo-rumbo');
        }
    }

    function adjustCanvasSize(width, height) {
        if (!canvas) return;
        canvas.width = width || 1080;
        canvas.height = height || 1350;
    }

    function tryLoadVideo(videoSrc, text, fallbackImg) {
        const video = document.createElement('video');
        video.src = videoSrc;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;

        video.onloadeddata = () => {
            currentVideoElem = video;
            if (video.videoWidth && video.videoHeight) {
                adjustCanvasSize(video.videoWidth, video.videoHeight);
            }
            video.play().then(() => {
                function loop() {
                    if (currentVideoElem === video && ctx && canvas) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        drawTextOverlay(text);
                        animationFrameId = requestAnimationFrame(loop);
                    }
                }
                loop();
            }).catch(() => {
                drawCanvasFrame(fallbackImg, text);
            });
        };

        video.onerror = () => {
            drawCanvasFrame(fallbackImg, text);
        };
    }

    function drawCanvasFrame(bgImg, text) {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOnly(text) {
        if (!ctx || !canvas) return;
        adjustCanvasSize(1080, 1350);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOverlay(text) {
        if (!ctx || !canvas || !text) return;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const maxWidth = canvas.width * 0.8;
        const lineHeight = canvas.height * 0.052;
        const x = canvas.width / 2;
        const y = canvas.height * 0.46;

        let fontSize = Math.round(canvas.width * 0.038);
        if (text.length > 150) fontSize = Math.round(canvas.width * 0.032);
        if (text.length > 250) fontSize = Math.round(canvas.width * 0.027);

        ctx.font = `400 ${fontSize}px 'Montserrat', sans-serif`;

        const words = text.split(' ');
        let lines = [];
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
            let word = words[i];
            let width = ctx.measureText(currentLine + " " + word).width;
            if (width < maxWidth) {
                currentLine += " " + word;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        lines.push(currentLine);

        const totalHeight = lines.length * lineHeight;
        let startY = y - (totalHeight / 2) + (lineHeight / 2);

        lines.forEach((line, index) => {
            ctx.fillText(line, x, startY + (index * lineHeight));
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        canvas = document.getElementById('cardCanvas');
        ctx = canvas ? canvas.getContext('2d') : null;
        blockSelect = document.getElementById('blockSelect');
        prevBtn = document.getElementById('prevBtn');
        nextBtn = document.getElementById('nextBtn');
        randomBtn = document.getElementById('randomBtn');
        homeBtn = document.getElementById('homeBtn');
        huellaCounter = document.getElementById('huellaCounter');
        loadingElem = document.getElementById('loading');
        botonesAccionContainer = document.getElementById('botonesAccionContainer');

        populateSelect();

        if (homeBtn) {
            homeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = "https://palabrasyfrasesperdidas-dotcom.github.io/palabrasyfrasesperdidas/";
            });
        }

        if (blockSelect) {
            blockSelect.addEventListener('change', (e) => {
                filterByBlock(parseInt(e.target.value, 10), false);
            });
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCurrentHuella();
                }
            });
        }

        if (nextBtn) {
            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex < currentFilteredFrases.length - 1) {
                    currentIndex++;
                    renderCurrentHuella();
                }
            });
        }

        if (randomBtn) {
            randomBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (allFrases.length === 0) return;
                const randomIndex = Math.floor(Math.random() * allFrases.length);
                const randomItem = allFrases[randomIndex];
                const blockValue = Number(randomItem.bloque || randomItem.block);
                
                blockSelect.value = blockValue.toString();
                currentFilteredFrases = allFrases.filter(f => Number(f.bloque || f.block) === blockValue);
                currentIndex = currentFilteredFrases.findIndex(f => f.id === randomItem.id);
                if (currentIndex === -1) currentIndex = 0;
                renderCurrentHuella();
            });
        }

        loadData();
    });
</script>
